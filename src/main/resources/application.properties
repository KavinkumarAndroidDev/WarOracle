spring.application.name=WarOracle

# Clash of Clans Official API Tokens (Supports multiple comma-separated tokens via CLASH_API_TOKENS, or single token via CLASH_API_TOKEN)
clash.api.tokens=${CLASH_API_TOKENS:${clash.api.token:}}
clash.api.token=${CLASH_API_TOKEN:eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiIsImtpZCI6IjI4YTMxOGY3LTAwMDAtYTFlYi03ZmExLTJjNzQzM2M2Y2NhNSJ9..tJ5IEvpMQGfPyukBygptcBCiCwPg_-GJqzXuE_0iofjQ9hC9HkFwkho65CmjJYaN20Czujy5uRJGbEOjRukZWw}

# MySQL Database Configuration (Configurable via DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/waroracle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hazelcast Configuration (Configurable via HAZELCAST_CLUSTER_NAME, HAZELCAST_ADDRESSES)
hazelcast.cluster-name=${HAZELCAST_CLUSTER_NAME:dev}
hazelcast.network.addresses=${HAZELCAST_ADDRESSES:127.0.0.1:5701}

# Clash API Cache TTL Settings (in minutes)
clash.api.cache.ttl-minutes=3
clash.api.cache.war-ttl-minutes=1
